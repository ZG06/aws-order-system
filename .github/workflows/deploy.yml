on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch repository source code
      - name: Checkout Code
        uses: actions/checkout@v7

      # Step 2: Setup Go and run unit tests
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - name: Run Go Tests
        run: go test -v ./...

      # Step 3: Authenticate
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}

      # Step 4: Build & Zip Lambda binary
      - name: Build & Zip Lambda binary
        working-directory: ./terraform/modules/lambda/resources
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags lambda.norpc -ldflags="-s -w" -o bootstrap main.go
          zip -j ./function.zip bootstrap

      # Step 5: Setup Terraform and build the infrastructure
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init & Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve